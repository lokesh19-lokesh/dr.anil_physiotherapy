<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradient: Fresh Green -> Secondary Teal -> Primary Blue -> Primary Dark -->
    <linearGradient id="brandGradA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CCB8F" />
      <stop offset="35%" stop-color="#14B8A6" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0D3B66" />
    </linearGradient>

    <!-- Active Human Figure Gradient -->
    <linearGradient id="humanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#4CCB8F" />
    </linearGradient>

    <!-- Right Leg Ribbon Gradient -->
    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B66" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- ================= LOGO ICON (Letter A + Spine + Active Recovery) ================= -->
  <g transform="translate(10, 8)">
    <!-- Left Ribbon of "A" -->
    <path d="M12 96 C16 75, 28 42, 54 22 C64 14, 76 8, 86 6 C84 14, 78 24, 70 34 C50 60, 42 78, 38 96 Z" fill="url(#brandGradA)" />
    
    <!-- Top & Right Arch of "A" -->
    <path d="M86 6 C96 14, 102 28, 98 44 C94 58, 82 72, 70 82 C62 88, 52 92, 42 94 C46 88, 52 80, 58 72 C68 58, 76 46, 78 34 C80 22, 76 14, 70 12 C76 8, 82 6, 86 6 Z" fill="url(#rightLegGrad)" />

    <!-- Vertebrae / Spine Dots curving inside "A" -->
    <circle cx="28" cy="88" r="2.8" fill="#14B8A6" />
    <circle cx="34" cy="77" r="3.0" fill="#14B8A6" />
    <circle cx="41" cy="65" r="3.2" fill="#0EA5E9" />
    <circle cx="49" cy="53" r="3.4" fill="#0EA5E9" />
    <circle cx="58" cy="41" r="3.6" fill="#0EA5E9" />
    <circle cx="68" cy="30" r="3.6" fill="#0EA5E9" />
    <circle cx="78" cy="22" r="3.2" fill="#0D3B66" />

    <!-- Active Human Figure with Raised Arms (Celebrating Mobility) -->
    <!-- Head -->
    <circle cx="106" cy="20" r="7.5" fill="url(#humanGrad)" />
    <!-- Torso and Joyous Raised Arms -->
    <path d="M96 36 C102 32, 108 32, 114 36 C118 31, 124 24, 130 18 C126 26, 122 34, 118 40 C114 48, 108 58, 98 64 C94 56, 92 48, 92 40 C88 34, 84 28, 80 24 C86 28, 92 32, 96 36 Z" fill="url(#humanGrad)" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(150, 18)">
    <!-- Dr. Anil's -->
    <text x="0" y="38" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#0D3B66" letter-spacing="-0.02em">Dr.Anil's</text>
    <!-- Vibrant dot on 'i' -->
    <circle cx="106" cy="18" r="3.5" fill="#0EA5E9" />

    <!-- Physiotherapy & Pain Relief -->
    <text x="2" y="66" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0D3B66" letter-spacing="0.02em">Physiotherapy &amp; Pain Relief</text>

    <!-- Tagline Divider & Slogan: MOVE BETTER   LIVE PAIN-FREE -->
    <line x1="2" y1="80" x2="68" y2="80" stroke="#14B8A6" stroke-width="2.2" stroke-linecap="round" />
    <text x="78" y="83.5" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.18em">MOVE BETTER</text>
    <circle cx="182" cy="80.5" r="2" fill="#14B8A6" />
    <text x="194" y="83.5" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.18em">LIVE PAIN-FREE</text>
    <line x1="324" y1="80" x2="390" y2="80" stroke="#14B8A6" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
